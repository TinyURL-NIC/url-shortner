name: snaplink

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: snaplink-backend
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/v3/api-docs || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - snaplink-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: snaplink-frontend
    restart: unless-stopped
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8080
    ports:
      - "5174:5174"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - snaplink-network

networks:
  snaplink-network:
    driver: bridge
